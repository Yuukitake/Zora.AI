name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # This repo is authored on Windows, where git cannot record the executable
      # bit, so gradlew lands as 100644 on a Linux checkout and `./gradlew` dies
      # with "Permission denied". The index mode is fixed too; this is belt and braces.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Both flavours ship, so both suites run in a single Gradle invocation.
      # Deliberately not `:app:test`: that also compiles the release variants and
      # needs more heap than the 2 GB this project's gradle.properties allows.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testZoraDebugUnitTest :app:testSlvDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
